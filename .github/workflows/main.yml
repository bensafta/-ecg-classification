name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: "3.10"
  MIN_COVERAGE: 70

jobs:
# ========================
# 1️⃣ CI – Tests & Qualité
# ========================
  test:
    name: Tests, Qualité & Data
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 black pytest pytest-cov

      - name: Lint (flake8)
        run: |
          flake8 src/ tests/ --count --select=E9,F63,F7,F82 --statistics
          flake8 src/ tests/ --count --exit-zero --max-line-length=127

      - name: Format check (black)
        run: black --check src/ tests/

      - name: Run tests + coverage
        run: |
          pytest tests/ \
            --cov=src \
            --cov-fail-under=${{ env.MIN_COVERAGE }} \
            --cov-report=xml \
            --cov-report=html

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: htmlcov/

# ========================
# 2️⃣ Docker Build & Smoke
# ========================
  docker:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t ecg-api:${{ github.sha }} .

      - name: Build Streamlit image
        run: docker build -f docker/Dockerfile.streamlit -t ecg-streamlit:${{ github.sha }} .

      - name: Run API container (healthcheck)
        run: |
          docker run -d -p 8000:8000 --name api ecg-api:${{ github.sha }}
          sleep 10
          curl -f http://localhost:8000/ || exit 1
          docker stop api

      - name: Validate docker-compose
        run: docker-compose -f docker/docker-compose.yml config

# ========================
# 3️⃣ Security Scans
# ========================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - uses: actions/checkout@v3

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-fs.sarif

      - name: Trivy Docker image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ecg-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-image.sarif

      - name: Upload security reports
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: |
            trivy-fs.sarif
            trivy-image.sarif

# ========================
# 4️⃣ CD
# ========================
  deploy:
    name: CD - Docker Compose
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - uses: actions/checkout@v3

      - name: Run docker-compose
        run: |
          docker-compose -f docker/docker-compose.yml up -d
